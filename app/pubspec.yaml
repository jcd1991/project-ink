name: project_ink
description: Offline-first cross-platform drawing and comic studio.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: 3.47.5
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  file_selector: ^1.1.0
  file_selector_platform_interface: ^2.7.0
  flutter_rust_bridge: 2.13.0
  ink_bridge:
    path: rust_builder
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2
  ffigen: ^22.0.0
flutter:
  uses-material-design: true
  assets:
    - ../assets/brushes/
    - ../assets/textures/
    - ../assets/branding/project-ink-app-icon-master.png
    - ../assets/templates/
    - assets/icons/
