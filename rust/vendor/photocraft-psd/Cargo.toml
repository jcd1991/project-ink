[package]
name = "photocraft-psd"
version = "0.15.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "PhotoCraft PSD/PSB parsing components vendored and bounded for Project Ink"

[lib]
name = "photocraft_psd"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = "2"
flate2 = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["testgen"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# This upstream crate brings its own extensive parser-focused checks at crate
# level. Keep those hard denials while avoiding Project Ink's broad
# all/pedantic style set imposing hundreds of unrelated edits on vendored code.
[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
